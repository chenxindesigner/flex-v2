<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#fef9f7" />
  <title>陳芯｜數位名片分享</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
    body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#fef9f7,#eadfde);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#55342e;touch-action:pan-y}
    .card{width:min(100%,440px);padding:38px 28px 30px;background:rgba(255,255,255,.92);border:1px solid rgba(85,52,46,.1);border-radius:24px;box-shadow:0 18px 55px rgba(85,52,46,.12);text-align:center}
    .eyebrow{margin:0 0 12px;font-family:Georgia,serif;font-size:12px;letter-spacing:.28em;color:#a65f58}
    h1{margin:0;font-family:Georgia,"Noto Serif TC",serif;font-size:34px;font-weight:500;letter-spacing:.05em}
    .name{margin:10px 0 0;font-family:"Noto Serif TC",serif;font-size:20px;letter-spacing:.28em}
    .line{width:86px;height:1px;margin:18px auto 24px;background:#a65f58}
    .service{margin:0;color:#6f6a67;font-size:14px;line-height:1.9;letter-spacing:.04em}
    button{width:100%;margin-top:30px;padding:14px 18px;border:0;border-radius:12px;background:#d7c3c4;color:#382321;font-size:16px;font-weight:700;cursor:pointer}
    button:active{transform:scale(.99)}
    button:disabled{opacity:.58;cursor:wait}
    .hint{margin:14px 0 0;color:#8a807c;font-size:12px;line-height:1.6}
    .status{min-height:20px;margin:12px 0 0;color:#a65f58;font-size:13px;line-height:1.6}
    .code{margin-top:8px;color:#9a8d88;font-size:11px}
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">A BETTER YOU</p>
    <h1>CHEN.XIN</h1>
    <p class="name">陳芯</p>
    <div class="line"></div>
    <p class="service">LINE OA 建置｜AI 自動化｜視覺設計<br>從品牌畫面 到真正好用的系統</p>
    <button id="shareButton" type="button" disabled>準備中⋯</button>
    <p class="hint">歡迎分享給身邊有需求的朋友<br>成功合作可享推薦獎金</p>\n    <p class="hint" style="margin-top:6px;font-size:11px">推薦回饋請使用本頁分享按鈕，系統才會記錄推薦來源</p>
    <p id="status" class="status" role="status"></p>
    <p id="memberCode" class="code"></p>
  </main>

  <script>
    const LIFF_ID = "2007730669-c8K2cktB";
    const LIFF_BASE_URL = "https://liff.line.me/2007730669-c8K2cktB/";
    const TRACK_API = "https://tzdaqrfsgwijbswfxlwj.supabase.co/functions/v1/flex-card-track";

    const FALLBACK_TARGETS = {
      portfolio: "https://chenxinstudio.com/#portfolio",
      booking: "https://smart-booking-system-one.vercel.app",
      line_oa: "https://line.me/R/ti/p/@113irqmx",
      idea_space: "https://line.me/R/ti/p/@989mrfum"
    };

    const button = document.getElementById("shareButton");
    const status = document.getElementById("status");
    const memberCode = document.getElementById("memberCode");

    let ownReferralToken = "";
    let incomingReferralToken = "";
    let currentAction = "open";
    let isSharing = false;

    function getSessionId(){
      try{
        let id = sessionStorage.getItem("flexCardSessionId");
        if(!id){
          id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2);
          sessionStorage.setItem("flexCardSessionId", id);
        }
        return id;
      }catch(e){
        return String(Date.now());
      }
    }

    function readLiffParams(){
      const params = new URLSearchParams(window.location.search);
      incomingReferralToken = params.get("r") || "";
      currentAction = params.get("a") || "open";
    }

    function makeLiffActionUrl(action){
      const params = new URLSearchParams();
      if(ownReferralToken) params.set("r", ownReferralToken);
      params.set("a", action);
      return LIFF_BASE_URL + "?" + params.toString();
    }

    async function track(action){
      const accessToken = liff.getAccessToken();
      if(!accessToken) throw new Error("no_line_access_token");

      const response = await fetch(TRACK_API, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          accessToken,
          referralToken: incomingReferralToken || null,
          action,
          sessionId: getSessionId()
        })
      });

      if(!response.ok) throw new Error("tracking_failed");
      const data = await response.json();

      if(data && data.member){
        ownReferralToken = data.member.referralToken || ownReferralToken;
        memberCode.textContent = data.member.referralCode ? "推薦編號 " + data.member.referralCode : "";
      }
      return data;
    }

    function buildBusinessCard(){
      return {
        type: "flex",
        altText: "陳芯｜LINE OA建置・AI自動化・視覺設計",
        contents: {
          type: "bubble",
          hero: {
            type: "image",
            url: "https://lh3.googleusercontent.com/d/1AFkszvMy7vTCQgEhRV3pnuo-JQvdcsyt",
            size: "full",
            aspectRatio: "4:3",
            aspectMode: "cover"
          },
          body: {
            type: "box",
            layout: "vertical",
            contents: [
              {
                type: "text",
                text: "LINE OA建置｜AI 自動化｜視覺設計",
                weight: "bold",
                size: "md",
                color: "#55342e"
              },
              {
                type: "box",
                layout: "baseline",
                margin: "md",
                contents: [
                  {
                    type: "text",
                    text: "⭑ 從品牌畫面，到真正好用的系統 ⭑",
                    size: "md",
                    color: "#A65F58",
                    margin: "none",
                    flex: 0
                  }
                ]
              },
              {
                type: "box",
                layout: "vertical",
                margin: "md",
                spacing: "none",
                contents: [
                  {
                    type: "box",
                    layout: "baseline",
                    spacing: "none",
                    contents: [
                      {
                        type: "text",
                        text: "從規劃、設計一路到系統整合，一次處理",
                        color: "#6F6A67",
                        size: "sm"
                      }
                    ],
                    margin: "none"
                  },
                  {
                    type: "box",
                    layout: "baseline",
                    spacing: "none",
                    contents: [
                      {
                        type: "text",
                        text: "減少來回溝通與重複確認，執行更有效率",
                        color: "#6F6A67",
                        size: "sm"
                      }
                    ],
                    margin: "md"
                  }
                ]
              }
            ],
            margin: "none",
            spacing: "none"
          },
          footer: {
            type: "box",
            layout: "vertical",
            spacing: "none",
            contents: [
              {
                type: "box",
                layout: "horizontal",
                contents: [
                  {
                    type: "button",
                    action: {
                      type: "uri",
                      label: "作品集",
                      uri: makeLiffActionUrl("portfolio")
                    },
                    margin: "none",
                    height: "sm",
                    style: "link",
                    color: "#55342e"
                  },
                  {
                    type: "button",
                    action: {
                      type: "uri",
                      label: "預約諮詢",
                      uri: makeLiffActionUrl("booking")
                    },
                    color: "#55342e",
                    style: "link",
                    height: "sm",
                    margin: "none"
                  }
                ]
              },
              {
                type: "box",
                layout: "horizontal",
                contents: [
                  {
                    type: "button",
                    action: {
                      type: "uri",
                      label: "LINE官網",
                      uri: makeLiffActionUrl("line_oa")
                    },
                    margin: "none",
                    height: "sm",
                    style: "link",
                    color: "#55342e"
                  },
                  {
                    type: "button",
                    action: {
                      type: "uri",
                      label: "意念空間",
                      uri: makeLiffActionUrl("idea_space")
                    },
                    style: "link",
                    height: "sm",
                    color: "#55342e"
                  }
                ]
              },
              {
                type: "box",
                layout: "vertical",
                margin: "md",
                spacing: "xs",
                contents: [
                  {
                    type: "text",
                    text: "歡迎分享給身邊有需求的朋友",
                    size: "xs",
                    color: "#8A807C",
                    align: "center"
                  },
                  {
                    type: "text",
                    text: "成功合作可享推薦獎金",
                    size: "sm",
                    weight: "bold",
                    color: "#A65F58",
                    align: "center"
                  },
                  {
                    type: "button",
                    action: {
                      type: "uri",
                      label: "名片分享",
                      uri: makeLiffActionUrl("share")
                    },
                    height: "sm",
                    color: "#d7c3c4",
                    style: "secondary",
                    margin: "sm"
                  }
                ]
              }
            ],
            flex: 0,
            background: {
              type: "linearGradient",
              angle: "0deg",
              startColor: "#fef9f7",
              endColor: "#fef9f7"
            },
            margin: "none"
          },
          styles: {
            body: {
              backgroundColor: "#fef9f7"
            },
            footer: {
              separator: true
            }
          }
        }
      };
    }

    async function shareBusinessCard(trackClick){
      if(isSharing) return;
      if(!liff.isApiAvailable("shareTargetPicker")){
        status.textContent = "請使用手機 LINE 開啟此頁";
        return;
      }

      isSharing = true;
      button.disabled = true;
      button.textContent = "開啟好友名單⋯";
      status.textContent = "";

      try{
        if(trackClick) await track("share");
        if(!ownReferralToken) throw new Error("missing_referral_token");

        const result = await liff.shareTargetPicker([buildBusinessCard()]);
        if(result){
          status.textContent = "名片已分享完成";
          try{ await track("share_completed"); }catch(e){}
        }else{
          status.textContent = "你已取消分享";
        }
      }catch(error){
        console.error(error);
        status.textContent = "分享暫時失敗，請再按一次";
      }finally{
        isSharing = false;
        button.disabled = false;
        button.textContent = "分享給 LINE 好友";
      }
    }

    async function init(){
      try{
        await liff.init({liffId:LIFF_ID});

        if(!liff.isLoggedIn()){
          status.textContent = "正在連接 LINE⋯";
          liff.login({redirectUri:window.location.href});
          return;
        }

        readLiffParams();

        status.textContent = "正在確認名片資料⋯";
        const tracked = await track(currentAction);

        if(currentAction === "portfolio" || currentAction === "booking" || currentAction === "line_oa" || currentAction === "idea_space"){
          const target = tracked && tracked.targetUrl ? tracked.targetUrl : FALLBACK_TARGETS[currentAction];
          status.textContent = "即將開啟⋯";
          window.location.replace(target);
          return;
        }

        button.disabled = false;
        button.textContent = "分享給 LINE 好友";
        status.textContent = "";

        if(currentAction === "share"){
          setTimeout(() => {
            shareBusinessCard(false);
          }, 150);
        }
      }catch(error){
        console.error(error);
        button.disabled = false;
        button.textContent = "重新連線";
        status.textContent = "名片連線失敗，請再試一次";
      }
    }

    button.addEventListener("click", async () => {
      if(button.textContent === "重新連線"){
        button.disabled = true;
        button.textContent = "準備中⋯";
        await init();
        return;
      }
      await shareBusinessCard(true);
    });

    init();
  </script>
</body>
</html>
