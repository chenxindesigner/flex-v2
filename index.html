<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Flex 卡片分享器 v3.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f6f6;padding:20px;margin:0}
    .card{max-width:800px;margin:40px auto;background:#fff;border-radius:16px;box-shadow:0 0 12px rgba(0,0,0,.05);padding:30px}
    h1{font-size:28px;color:#333;text-align:center;margin-bottom:20px}
    .updated{font-size:13px;color:#888;text-align:center;margin:-10px 0 22px}
    textarea,input{width:100%;font-size:15px;padding:12px;margin:12px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;font-family:monospace}
    textarea{height:380px;resize:vertical}
    button{background:linear-gradient(135deg,#513934,#d4c0ba);color:#fff;border:0;padding:14px 20px;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;width:100%;transition:background .3s}
    button:hover{background:linear-gradient(135deg,#6e4d3a,#e0d2ca)}
    .hint{font-size:12px;color:#666;margin-top:-6px}
    #cardShareMode{display:none;max-width:520px;text-align:center}
    #cardShareMode h1{font-family:Georgia,"Noto Serif TC",serif;color:#55342e}
    #cardShareMode p{color:#6f6a67;line-height:1.8}
    #retryShare{margin-top:18px;background:#d7c3c4;color:#382321}
  </style>
</head>
<body>
  <div class="card" id="normalMode">
    <h1>✨ Flex 卡片分享器 v3.1</h1>
    <div class="updated">更新日期：2026.09.19</div>
    <input id="altTextInput" type="text" placeholder="請輸入卡片標題 altText（可留空）" />
    <textarea id="jsonInput" placeholder="請貼上完整 Flex JSON（bubble/carousel 或完整 flex）"></textarea>
    <div class="hint">※ 偵測到文字觸發（message / msg: / actionText）將自動改成 URI 後再分享；原本的 URI 不會被改動。</div>
    <button onclick="sendToFriends()">📤 分享給 LINE 好友</button>
  </div>

  <div class="card" id="cardShareMode">
    <h1>CHEN.XIN｜陳芯</h1>
    <p id="cardShareStatus">正在開啟 LINE 好友／群組選擇器⋯</p>
    <button id="retryShare" type="button" onclick="shareBusinessCard()">重新開啟好友名單</button>
  </div>

  <script>
    const LIFF_ID = "2007736327-ZO83VAmo";
    const DEFAULT_FALLBACK_URI = "https://line.me/";
    const CARD_SHARE_LIFF_URL = "https://liff.line.me/2007736327-ZO83VAmo/?mode=card";

    const BUSINESS_CARD_MESSAGE = {
      type: "flex",
      altText: "陳芯｜LINE OA建置・AI自動化・視覺設計",
      contents: {
        type: "bubble",
        hero: {
          type: "image",
          url: "https://lh3.googleusercontent.com/d/1AFkszvMy7vTCQgEhRV3pnuo-JQvdcsyt",
          size: "full",
          aspectRatio: "4:3",
          aspectMode: "cover"
        },
        body: {
          type: "box",
          layout: "vertical",
          margin: "none",
          spacing: "none",
          contents: [
            {type:"text",text:"LINE OA建置｜AI 自動化｜視覺設計",weight:"bold",size:"md",color:"#55342e"},
            {type:"box",layout:"baseline",margin:"md",contents:[
              {type:"text",text:"⭑ 從品牌畫面，到真正好用的系統 ⭑",size:"md",color:"#A65F58",margin:"none",flex:0}
            ]},
            {type:"box",layout:"vertical",margin:"md",spacing:"none",contents:[
              {type:"box",layout:"baseline",spacing:"none",contents:[
                {type:"text",text:"從規劃、設計一路到系統整合，一次處理",color:"#6F6A67",size:"sm"}
              ],margin:"none"},
              {type:"box",layout:"baseline",spacing:"none",contents:[
                {type:"text",text:"減少來回溝通與重複確認，執行更有效率",color:"#6F6A67",size:"sm"}
              ],margin:"md"}
            ]}
          ]
        },
        footer: {
          type: "box",
          layout: "vertical",
          spacing: "none",
          flex: 0,
          margin: "none",
          background: {type:"linearGradient",angle:"0deg",startColor:"#fef9f7",endColor:"#fef9f7"},
          contents: [
            {type:"box",layout:"horizontal",contents:[
              {type:"button",action:{type:"uri",label:"作品集",uri:"https://chenxinstudio.com/#portfolio"},margin:"none",height:"sm",style:"link",color:"#55342e"},
              {type:"button",action:{type:"uri",label:"預約諮詢",uri:"https://smart-booking-system-one.vercel.app"},color:"#55342e",style:"link",height:"sm",margin:"none"}
            ]},
            {type:"box",layout:"horizontal",contents:[
              {type:"button",action:{type:"uri",label:"LINE官網",uri:"https://line.me/R/ti/p/@113irqmx"},margin:"none",height:"sm",style:"link",color:"#55342e"},
              {type:"button",action:{type:"uri",label:"意念空間",uri:"https://line.me/R/ti/p/@989mrfum"},style:"link",height:"sm",color:"#55342e"}
            ]},
            {type:"box",layout:"vertical",contents:[
              {type:"button",action:{type:"uri",label:"名片分享",uri:CARD_SHARE_LIFF_URL},height:"sm",color:"#d7c3c4",style:"secondary"}
            ]}
          ]
        },
        styles: {
          body: {backgroundColor:"#fef9f7"},
          footer: {separator:true}
        }
      }
    };

    let isCardShareMode = false;

    function detectCardShareMode(){
      try{
        const params = new URLSearchParams(window.location.search);

        // 1. 一般 query：?mode=card
        if(params.get("mode") === "card") return true;

        // 2. LINE LIFF 有時會把原始參數包進 liff.state
        const state = params.get("liff.state");
        if(state){
          let decoded = state;
          for(let i=0;i<3;i++){
            try{
              const next = decodeURIComponent(decoded);
              if(next === decoded) break;
              decoded = next;
            }catch(e){ break; }
          }

          if(decoded.includes("mode=card")) return true;

          try{
            const stateUrl = new URL(decoded, window.location.origin);
            if(stateUrl.searchParams.get("mode") === "card") return true;
          }catch(e){}
        }

        // 3. 最後保險：處理仍在 href 中的編碼參數
        const href = window.location.href;
        if(
          href.includes("mode=card") ||
          href.includes("mode%3Dcard") ||
          href.includes("mode%253Dcard")
        ) return true;

        return false;
      }catch(e){
        return false;
      }
    }

    // 先判斷一次，避免畫面先閃出一般分享器
    isCardShareMode = detectCardShareMode();
    if(isCardShareMode){
      document.getElementById("normalMode").style.display = "none";
      document.getElementById("cardShareMode").style.display = "block";
    }

    liff.init({ liffId: LIFF_ID })
      .then(async () => {
        // init 後再判斷一次，兼容 LIFF secondary redirect
        isCardShareMode = detectCardShareMode();

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (isCardShareMode) {
          document.getElementById("normalMode").style.display = "none";
          document.getElementById("cardShareMode").style.display = "block";
          await shareBusinessCard();
        }
      })
      .catch(err => {
        if (detectCardShareMode()) {
          document.getElementById("normalMode").style.display = "none";
          document.getElementById("cardShareMode").style.display = "block";
          document.getElementById("cardShareStatus").textContent = "LINE 初始化失敗，請重新開啟此頁";
        } else {
          alert("❌ LIFF 初始化失敗：" + err);
        }
      });

    async function shareBusinessCard(){
      const status = document.getElementById("cardShareStatus");
      if (!liff.isApiAvailable("shareTargetPicker")) {
        status.textContent = "目前無法開啟好友名單，請使用手機 LINE 開啟";
        return;
      }

      status.textContent = "正在開啟 LINE 好友／群組選擇器⋯";
      try{
        const res = await liff.shareTargetPicker([BUSINESS_CARD_MESSAGE]);
        if(res === null){
          status.textContent = "你已取消分享";
          return;
        }
        status.textContent = "名片已分享完成";
        setTimeout(() => {
          try { liff.closeWindow(); } catch(e) {}
        }, 500);
      }catch(e){
        status.textContent = "好友名單沒有成功開啟，請按下方按鈕再試一次";
      }
    }

    function convertMessageActionsToUri(obj){
      if(!obj || typeof obj!=='object') return obj;

      if(obj.action && typeof obj.action==='object'){
        const a=obj.action;

        if(a.type==='message' && typeof a.text==='string'){
          obj.action = { type:'uri', label:a.label||'', uri: DEFAULT_FALLBACK_URI };
        }
        else if(a.type==='uri' && typeof a.uri==='string' && a.uri.startsWith('msg:')){
          obj.action = { type:'uri', label:a.label||'', uri: DEFAULT_FALLBACK_URI };
        }
        else if(a.type==='uri' && typeof a.actionText==='string' && a.actionText.trim()){
          obj.action = { type:'uri', label:a.label||'', uri: DEFAULT_FALLBACK_URI };
        }
      }

      for(const k in obj){
        if(obj[k] && typeof obj[k]==='object') obj[k]=convertMessageActionsToUri(obj[k]);
      }
      return obj;
    }

    function sanitize(obj, path=""){
      if(typeof obj!=='object' || obj===null) return obj;

      if(obj.type==='box' && Array.isArray(obj.contents) && obj.contents.length===0 && path.includes("footer")){
        return obj;
      }
      if(obj.type==='box' && Array.isArray(obj.contents) && obj.contents.length===0){
        return null;
      }
      if(obj.url && typeof obj.url==='string'){
        const m=obj.url.match(/https:\/\/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
        if(m && !obj.url.includes('/u/0/')){
          obj.url=`https://lh3.googleusercontent.com/u/0/d/${m[1]}=w1080`;
        }
      }

      for(const key in obj){
        if(Array.isArray(obj[key])){
          obj[key]=obj[key].map((v,i)=>sanitize(v,`${path}.${key}[${i}]`)).filter(e=>e!==null);
        }else if(typeof obj[key]==='object'){
          obj[key]=sanitize(obj[key],`${path}.${key}`);
        }
      }
      return obj;
    }

    function toFlexMessage(parsed, altTextFallback){
      const isBubbleOrCarousel = parsed && typeof parsed==='object' &&
        (parsed.type==='bubble' || parsed.type==='carousel');
      if(isBubbleOrCarousel) return { type:'flex', altText:altTextFallback, contents:parsed };
      if(parsed && parsed.type==='flex'){ if(!parsed.altText) parsed.altText=altTextFallback; return parsed; }
      return null;
    }

    async function sendToFriends(){
      const raw=document.getElementById("jsonInput").value.trim();
      const altText=document.getElementById("altTextInput").value || "這是一則 Flex 卡片";
      if(!raw) return alert("⚠️ 請貼上 Flex JSON");
      if(!liff.isApiAvailable("shareTargetPicker")) return alert("⚠️ 請在『手機 LINE App』內開啟此頁");

      try{
        let parsed=JSON.parse(raw);
        parsed=sanitize(parsed);
        parsed=convertMessageActionsToUri(parsed);

        const message=toFlexMessage(parsed,altText);
        if(!message) return alert("❌ 需為 bubble/carousel 或完整 flex 結構");

        const res=await liff.shareTargetPicker([message]);
        if(res===null) return alert("ℹ️ 你已取消分享（未送出）");

        alert("✅ 已送出！如卡片原本含文字觸發，已自動改為連結（不影響原本 URI 按鈕）。");
        document.getElementById("jsonInput").value="";
        document.getElementById("altTextInput").value="";
      }catch(e){
        alert("❌ 送出失敗：\n"+e.message);
      }
    }
  </script>
</body>
</html>
