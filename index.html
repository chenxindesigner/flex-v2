<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Flex 卡片分享器 v3.0（自動轉 URI 版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f6f6;padding:20px;margin:0}
    .card{max-width:800px;margin:40px auto;background:#fff;border-radius:16px;box-shadow:0 0 12px rgba(0,0,0,.05);padding:30px}
    h1{font-size:28px;color:#333;text-align:center;margin-bottom:20px}
    textarea,input{width:100%;font-size:15px;padding:12px;margin:12px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;font-family:monospace}
    textarea{height:380px;resize:vertical}
    button{background:linear-gradient(135deg,#513934,#d4c0ba);color:#fff;border:0;padding:14px 20px;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;width:100%;transition:background .3s}
    button:hover{background:linear-gradient(135deg,#6e4d3a,#e0d2ca)}
    .hint{font-size:12px;color:#666;margin-top:-6px}
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ Flex 卡片分享器 v3.0（自動轉 URI 版）</h1>
    <input id="altTextInput" type="text" placeholder="請輸入卡片標題 altText（可留空）" />
    <textarea id="jsonInput" placeholder="請貼上完整 Flex JSON（bubble/carousel 或完整 flex）"></textarea>
    <div class="hint">※ 偵測到文字觸發（message / msg: / actionText）將自動改成 URI 後再分享；原本的 URI 不會被改動。</div>
    <button onclick="sendToFriends()">📤 分享給 LINE 好友</button>
  </div>

  <script>
    // 文字觸發的預設落點（不想開別的頁就用這個）
    const DEFAULT_FALLBACK_URI = "https://line.me/";

    liff.init({ liffId: "2007736327-ZO83VAmo" })
      .then(() => { if (!liff.isLoggedIn()) liff.login(); })
      .catch(err => alert("❌ LIFF 初始化失敗：" + err));

    // —— 把 message / msg: / actionText → 安全的 URI（不綁 OA、人人可用） ——
    function convertMessageActionsToUri(obj){
      if(!obj || typeof obj!=='object') return obj;

      if(obj.action && typeof obj.action==='object'){
        const a=obj.action;

        // 原生 message
        if(a.type==='message' && typeof a.text==='string'){
          obj.action = { type:'uri', label:a.label||'', uri: DEFAULT_FALLBACK_URI };
        }
        // 簡寫：uri: "msg:文字"
        else if(a.type==='uri' && typeof a.uri==='string' && a.uri.startsWith('msg:')){
          obj.action = { type:'uri', label:a.label||'', uri: DEFAULT_FALLBACK_URI };
        }
        // 自定欄位：actionText
        else if(a.type==='uri' && typeof a.actionText==='string' && a.actionText.trim()){
          obj.action = { type:'uri', label:a.label||'', uri: DEFAULT_FALLBACK_URI };
        }
      }

      for(const k in obj){
        if(obj[k] && typeof obj[k]==='object') obj[k]=convertMessageActionsToUri(obj[k]);
      }
      return obj;
    }

    // —— 保留你的清理：空 box、圖床網址正規化 ——
    function sanitize(obj, path=""){
      if(typeof obj!=='object' || obj===null) return obj;

      if(obj.type==='box' && Array.isArray(obj.contents) && obj.contents.length===0 && path.includes("footer")){
        return obj; // 保留 footer 空 box 作 spacer
      }
      if(obj.type==='box' && Array.isArray(obj.contents) && obj.contents.length===0){
        return null; // 其他空 box 移除
      }
      if(obj.url && typeof obj.url==='string'){
        const m=obj.url.match(/https:\/\/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
        if(m && !obj.url.includes('/u/0/')){
          obj.url=`https://lh3.googleusercontent.com/u/0/d/${m[1]}=w1080`;
        }
      }

      for(const key in obj){
        if(Array.isArray(obj[key])){
          obj[key]=obj[key].map((v,i)=>sanitize(v,`${path}.${key}[${i}]`)).filter(e=>e!==null);
        }else if(typeof obj[key]==='object'){
          obj[key]=sanitize(obj[key],`${path}.${key}`);
        }
      }
      return obj;
    }

    // —— 自動包成合法 flex ——
    function toFlexMessage(parsed, altTextFallback){
      const isBubbleOrCarousel = parsed && typeof parsed==='object' &&
        (parsed.type==='bubble' || parsed.type==='carousel');
      if(isBubbleOrCarousel) return { type:'flex', altText:altTextFallback, contents:parsed };
      if(parsed && parsed.type==='flex'){ if(!parsed.altText) parsed.altText=altTextFallback; return parsed; }
      return null;
    }

    async function sendToFriends(){
      const raw=document.getElementById("jsonInput").value.trim();
      const altText=document.getElementById("altTextInput").value || "這是一則 Flex 卡片";
      if(!raw) return alert("⚠️ 請貼上 Flex JSON");
      if(!liff.isApiAvailable("shareTargetPicker")) return alert("⚠️ 請在『手機 LINE App』內開啟此頁");

      try{
        let parsed=JSON.parse(raw);
        parsed=sanitize(parsed);
        parsed=convertMessageActionsToUri(parsed); // ← 核心：自動把文字觸發改成 URI

        const message=toFlexMessage(parsed,altText);
        if(!message) return alert("❌ 需為 bubble/carousel 或完整 flex 結構");

        const res=await liff.shareTargetPicker([message]);
        if(res===null) return alert("ℹ️ 你已取消分享（未送出）");

        alert("✅ 已送出！如卡片原本含文字觸發，已自動改為連結（不影響原本 URI 按鈕）。");
        document.getElementById("jsonInput").value="";
        document.getElementById("altTextInput").value="";
      }catch(e){
        alert("❌ 送出失敗：\n"+e.message);
      }
    }
  </script>
</body>
</html>
