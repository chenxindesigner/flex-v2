<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#fef9f7" />
  <title>陳芯｜數位名片分享</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
<style>
  :root{
    --bg:#f8eff1;--bg2:#f3e7ea;--paper:#fffdfd;--ink:#73696d;--soft:#8f8589;
    --rose:#b77f8d;--rose2:#dec8ce;--rose3:#f3e7ea;--line:#eadadd;--white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
  body{
    min-height:100dvh;padding:46px 18px 34px;display:flex;justify-content:center;align-items:flex-start;
    color:var(--ink);font-family:"Songti TC","Noto Serif TC","PMingLiU",serif;touch-action:pan-y;
    background:
      radial-gradient(circle at -12% 18%,transparent 0 170px,rgba(183,127,141,.13) 171px 172px,transparent 173px 198px,rgba(183,127,141,.08) 199px 200px,transparent 201px),
      radial-gradient(circle at 112% 84%,transparent 0 205px,rgba(183,127,141,.12) 206px 207px,transparent 208px 236px,rgba(183,127,141,.07) 237px 238px,transparent 239px),
      linear-gradient(145deg,var(--bg),var(--bg2));
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;
    background:
      linear-gradient(118deg,transparent 0 12%,rgba(255,255,255,.42) 12.2% 12.5%,transparent 12.8% 100%),
      linear-gradient(298deg,transparent 0 82%,rgba(255,255,255,.4) 82.2% 82.5%,transparent 82.8% 100%);
  }
  button{font:inherit;-webkit-tap-highlight-color:transparent}
  .card{
    position:relative;z-index:1;width:min(100%,430px);padding:34px 26px 27px;border-radius:28px;
    background:rgba(255,253,253,.96);border:1px solid rgba(183,127,141,.12);
    box-shadow:0 18px 52px rgba(103,78,84,.10);text-align:center;
  }
  .avatar{
    display:block;width:96px;height:auto;aspect-ratio:1/1;margin:0 auto 17px;border-radius:50%;
    object-fit:contain;box-shadow:0 5px 18px rgba(94,71,77,.06);
  }
  .eyebrow{
    margin:0 0 8px;font-family:Didot,"Bodoni 72",Baskerville,"Times New Roman",serif;
    font-size:10px;letter-spacing:.36em;color:#a66e7c;font-weight:500;
  }
  h1{
    margin:0;font-family:Didot,"Bodoni 72",Baskerville,"Times New Roman",serif;
    font-size:36px;line-height:1.05;font-weight:400;letter-spacing:.07em;color:#6a545a;
  }
  .name{margin:12px 0 0;font-size:22px;letter-spacing:.24em;color:#756469}
  .name-line{width:108px;height:1px;margin:8px auto 18px;background:#b77f8d}
  .service{margin:0;color:#827a7d;font-size:13.5px;line-height:1.95;letter-spacing:.035em}
  .actions{width:100%;margin:24px auto 0}
  .share-btn,.mini-btn{
    border:0;cursor:pointer;transition:transform .12s ease,opacity .12s ease;
  }
  .share-btn{
    width:100%;height:47px;margin:0;border-radius:12px;background:linear-gradient(90deg,#dfc9ce,#ead7db);
    color:#6f5f64;font-size:15px;font-weight:700;letter-spacing:.04em;box-shadow:none;
  }
  .share-btn:active,.mini-btn:active{transform:scale(.99)}
  .share-btn:disabled,.mini-btn:disabled{opacity:.55;cursor:wait}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:10px}
  .mini-btn{
    min-width:0;height:61px;margin:0;padding:9px 10px;border-radius:12px;background:#fffafa;
    border:1px solid #eadadd;color:#756a6e;text-align:left;
  }
  .mini-title{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:650;white-space:nowrap;color:#756a6e}
  .mini-sub{display:block;margin-top:5px;color:#a3999c;font-size:10px;line-height:1.4;white-space:nowrap}
  .arrow{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#9f858d;font-size:18px;font-weight:300}
  .rule{width:46px;height:1px;background:#dfc9ce;margin:24px auto 15px}
  .hint{margin:0;color:#91888b;font-size:11.5px;line-height:2.05}
  .hint strong{display:inline-block;margin-top:5px;color:#806b72;font-weight:650;line-height:1.9}
  .status{min-height:18px;margin:12px 0 0;color:#b26f7f;font-size:12px;line-height:1.5}
  .code{margin:6px 0 0;color:#9b9295;font-size:11px;letter-spacing:.08em}
  .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet.hidden{display:none}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(67,56,59,.28);backdrop-filter:blur(3px)}
  .sheet-panel{
    position:relative;width:min(100%,430px);max-height:82dvh;overflow:auto;background:#fffdfd;
    border-radius:24px 24px 0 0;padding:20px 18px max(24px,env(safe-area-inset-bottom));
    box-shadow:0 -18px 46px rgba(77,60,65,.16);text-align:left;
  }
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
  .sheet-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.04em;color:#514a4c}
  .sheet-head p{margin:5px 0 0;font-size:11px;color:#968d90}
  .close-sheet{width:32px;height:32px;border:0;border-radius:50%;background:#f5edef;color:#765f66;font-size:19px}
  .record-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .sum{padding:11px 7px;border-radius:12px;background:#faf4f5;text-align:center;border:1px solid #f0e4e6}
  .sum b{display:block;font-size:17px;color:#5d4a50}
  .sum span{display:block;margin-top:4px;font-size:9.5px;color:#978d90}
  .records-list{display:grid;gap:8px}
  .record{padding:12px;border:1px solid #eee3e5;border-radius:13px;background:#fff}
  .record-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .record-name{font-size:13px;font-weight:700;color:#514a4c}
  .record-meta{margin-top:4px;color:#999093;font-size:10px;line-height:1.5}
  .record-status{font-size:10px;color:#a06473;background:#f7ebee;border-radius:999px;padding:5px 8px;white-space:nowrap}
  .empty-records{padding:28px 10px;text-align:center;color:#9a9093;font-size:12px;line-height:1.7}
  @media(max-width:390px){
    body{padding:34px 14px 28px}
    .card{padding:30px 20px 24px}
    .avatar{width:90px}
    h1{font-size:33px}
    .service{font-size:13px}
    .mini-btn{padding-left:9px;padding-right:9px}
    .mini-title{font-size:12.5px}
    .mini-sub{font-size:9.5px}
  }
</style>
</head>

    function readLiffParams(){
      const params = new URLSearchParams(window.location.search);

      let referral = params.get("r") || "";
      let action = params.get("a") || "";

      const rawState = params.get("liff.state");
      if(rawState){
        try{
          const decoded = decodeURIComponent(rawState);
          const stateQuery = decoded.includes("?")
            ? decoded.slice(decoded.indexOf("?") + 1)
            : decoded.replace(/^\?/, "");
          const stateParams = new URLSearchParams(stateQuery);
          referral = referral || stateParams.get("r") || "";
          action = action || stateParams.get("a") || "";
        }catch(e){
          console.warn("Unable to parse liff.state", e);
        }
      }

      incomingReferralToken = referral;
      currentAction = action || "open";
    }

    const money = (n) => new Intl.NumberFormat("zh-TW",{style:"currency",currency:"TWD",maximumFractionDigits:0}).format(Number(n||0));
    const dateText = (v) => v ? new Intl.DateTimeFormat("zh-TW",{dateStyle:"short",timeStyle:"short"}).format(new Date(v)) : "—";
    const safe = (v) => String(v == null ? "" : v).replace(/[&<>"']/g,(m)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

    function closeRecordsSheet(){
      recordsSheet.classList.add("hidden");
      recordsSheet.setAttribute("aria-hidden","true");
    }

    async function openRecordsSheet(){
      recordsSheet.classList.remove("hidden");
      recordsSheet.setAttribute("aria-hidden","false");
      recordsContent.innerHTML='<div class="empty-records">正在讀取推薦紀錄⋯</div>';

      try{
        const accessToken=liff.getAccessToken();
        if(!accessToken) throw new Error("no_line_access_token");

        const response=await fetch(RECORDS_API,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({accessToken})
        });
        if(!response.ok) throw new Error("records_failed");

        const data=await response.json();
        const summary=data.summary||{};
        const records=Array.isArray(data.records)?data.records:[];

        const summaryHtml='<div class="record-summary">'+
          '<div class="sum"><b>'+Number(summary.referredCount||0)+'</b><span>已推薦</span></div>'+
          '<div class="sum"><b>'+Number(summary.dealCount||0)+'</b><span>推薦成交</span></div>'+
          '<div class="sum"><b>'+money(summary.commissionPending||0)+'</b><span>待發獎金</span></div>'+
        '</div>';

        const listHtml=records.length
          ? '<div class="records-list">'+records.map((r)=>{
              let label="推薦成立";
              if(Number(r.commissionPending||0)>0) label="獎金待發";
              else if(Number(r.commissionPaid||0)>0) label="已有獎金";
              else if(Number(r.dealCount||0)>0) label="已成交";

              return '<div class="record">'+
                '<div class="record-top">'+
                  '<div><div class="record-name">'+safe(r.displayName||"LINE 好友")+'</div>'+
                  '<div class="record-meta">'+safe(r.referralCode||"")+' · '+dateText(r.establishedAt)+
                  (Number(r.dealCount||0)>0?' · 成交 '+money(r.grossAmount||0):'')+
                  '</div></div>'+
                  '<span class="record-status">'+label+'</span>'+
                '</div>'+
              '</div>';
            }).join("")+'</div>'
          : '<div class="empty-records">目前還沒有成立的推薦紀錄<br>好友需點開名片內任一按鈕才會建立推薦關係</div>';

        recordsContent.innerHTML=summaryHtml+listHtml;
      }catch(error){
        console.error(error);
        recordsContent.innerHTML='<div class="empty-records">推薦紀錄暫時讀取失敗<br>請稍後再試一次</div>';
      }
    }

    async function shareBusinessCard(trackClick){
      if(isSharing) return;
      if(!liff.isApiAvailable("shareTargetPicker")){
        status.textContent = "請使用手機 LINE 開啟此頁";
        return;
      }

      isSharing = true;
      button.disabled = true;
      button.textContent = "開啟好友名單⋯";
      status.textContent = "";

      try{
        if(trackClick) await track("share");
        if(!ownReferralToken) throw new Error("missing_referral_token");

        const result = await liff.shareTargetPicker([buildBusinessCard()]);
        if(result){
          status.textContent = "名片已分享完成";
          try{ await track("share_completed"); }catch(e){}
        }else{
          status.textContent = "你已取消分享";
        }
      }catch(error){
        console.error(error);
        status.textContent = "分享暫時失敗，請再按一次";
      }finally{
        isSharing = false;
        button.disabled = false;
        button.textContent = "分享給 LINE 好友";
      }
    }

    async function init(){
      try{
        await liff.init({liffId:LIFF_ID});

        if(!liff.isLoggedIn()){
          status.textContent = "正在連接 LINE⋯";
          liff.login({redirectUri:window.location.href});
          return;
        }

        readLiffParams();

        status.textContent = "正在確認名片資料⋯";
        const tracked = await track(currentAction);

        if(currentAction === "portfolio" || currentAction === "booking" || currentAction === "line_oa" || currentAction === "idea_space"){
          const target = tracked && tracked.targetUrl ? tracked.targetUrl : FALLBACK_TARGETS[currentAction];
          status.textContent = "即將開啟⋯";
          window.location.replace(target);
          return;
        }

        button.disabled = false;
        recordsButton.disabled = false;
        button.textContent = "分享給 LINE 好友";
        status.textContent = "";

        if(currentAction === "share"){
          setTimeout(() => {
            shareBusinessCard(false);
          }, 150);
        }
      }catch(error){
        console.error(error);
        button.disabled = false;
        button.textContent = "重新連線";
        status.textContent = "名片連線失敗，請再試一次";
      }
    }

    recordsButton.addEventListener("click",openRecordsSheet);
    closeRecords.addEventListener("click",closeRecordsSheet);
    recordsBackdrop.addEventListener("click",closeRecordsSheet);
    inquiryButton.addEventListener("click",()=>{
      window.location.href=CONSULT_URL;
    });

    button.addEventListener("click", async () => {
      if(button.textContent === "重新連線"){
        button.disabled = true;
        button.textContent = "準備中⋯";
        await init();
        return;
      }
      await shareBusinessCard(true);
    });

    init();
  </script>
